<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <!-- Blue kiwi flesh -->
    <radialGradient id="kiwi" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#8bd8ff"/>
      <stop offset="22%" stop-color="#3298ed"/>
      <stop offset="55%" stop-color="#0967c9"/>
      <stop offset="82%" stop-color="#03489d"/>
      <stop offset="100%" stop-color="#012b69"/>
    </radialGradient>

    <!-- Luminous center -->
    <radialGradient id="heart">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e9fbff"/>
      <stop offset="75%" stop-color="#a7e7ff"/>
      <stop offset="100%" stop-color="#55b8ed"/>
    </radialGradient>

    <!-- Blue glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkle glow -->
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <clipPath id="kiwiClip">
      <circle cx="256" cy="256" r="207"/>
    </clipPath>

  </defs>


  <!-- ====================================== -->
  <!--              MAGICAL AURA              -->
  <!-- ====================================== -->

  <circle
    cx="256"
    cy="256"
    r="220"
    fill="#168cff"
    opacity=".16"
    filter="url(#glow)"
  />


